name: Release module ZIP
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.7.0)'
        required: true
        default: 'v2.7.0'
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
      - '!v*-so'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          MODVER=$(grep '^version=' module.prop | cut -d= -f2)
          echo "modver=$MODVER" >> "$GITHUB_OUTPUT"

      - name: Fetch zygisk .so from prior release
        run: |
          set -e
          mkdir -p zygisk
          # 从上一版发行包中提取 zygisk/arm64-v8a.so;compile.yml 在私仓构建,这里复用
          for SRC in \
            "https://github.com/${{ github.repository }}/releases/download/v2.6/Xmark-Tools.zip" \
            "https://github.com/${{ github.repository }}/releases/download/v2.5/Xmark-Tools.zip"; do
            if curl -fsSL -o /tmp/prior.zip "$SRC"; then
              echo "downloaded $SRC"
              unzip -p /tmp/prior.zip zygisk/arm64-v8a.so > zygisk/arm64-v8a.so
              break
            fi
          done
          test -s zygisk/arm64-v8a.so
          ls -la zygisk/

      - name: Set up Android NDK
        run: |
          set -e
          # lib-src/build.sh 需要 NDK。GitHub runner 上没有任何预装 NDK，
          # 不装这一步 build.sh 会直接 exit 1。
          NDK_VER=r27c
          URL="https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          echo "downloading $URL"
          curl -fsSL --retry 3 -o /tmp/ndk.zip "$URL"
          # 校验是完整 zip（防止 CDN 返回错误页被当成压缩包）
          unzip -tq /tmp/ndk.zip > /dev/null
          mkdir -p "$HOME/Android/Sdk/ndk"
          unzip -q /tmp/ndk.zip -d "$HOME/Android/Sdk/ndk"
          NDK_DIR="$(ls -d "$HOME"/Android/Sdk/ndk/*/ | head -1)"
          echo "NDK at: $NDK_DIR"
          # 供 build.sh 的 find_ndk 命中
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" --version

      - name: Build libdrmid_hook.so (NDK)
        run: |
          set -e
          # DRM 层防标记的 native 库。仓库不提交预编译产物(避免二进制进 git),
          # 由本步骤产出后打进 ZIP 的 lib/ 目录。
          bash lib-src/build.sh
          test -s lib/drmid_hook.so
          file lib/drmid_hook.so
          ls -la lib/

      - name: Self-check (static)
        run: |
          set -e
          # 65 项静态自检（导出符号、classifier 掩码语义、sepolicy、CI 结构等）
          bash lib-src/selfcheck.sh
          # 机型表自洽性：48 个机型的 set_all/set_fp 参数数、fingerprint 6 段格式、
          # brand/product/device 三者与 fp 的对应关系
          python3 lib-src/check_model_table.py
          # 冲突面：DRM 层与既有模块的属性交集、do_boot 是否含 stop
          python3 lib-src/check_conflicts.py

      - name: Assemble module ZIP
        run: |
          set -e
          STAGE=/tmp/stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # 排除仓库自身元数据 / CI / 本地构建产物,其余按原样打包(customize.sh、metainstall.sh、service.sh 等都是 base64 封装,不需要额外处理)
          # lib-src/ 是构建期源码,不进发布包(模块运行时只需要 lib/drmid_hook.so);
          # *.plain 是我本地解 base64 用的中间文件,更不能进包。
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude 'lib-src' \
            --exclude '*.plain' \
            ./ "$STAGE/"
          cp zygisk/arm64-v8a.so "$STAGE/zygisk/arm64-v8a.so"
          cd "$STAGE"
          # 与 v2.6 的 zip 一致:仓库根目录直接作为压缩包根
          zip -q -r "$GITHUB_WORKSPACE/Xmark-Tools.zip" .
          cd -
          ls -lh Xmark-Tools.zip
          sha256sum Xmark-Tools.zip | tee release.sha256

      - name: Sanity-check ZIP has fixed customize.sh
        run: |
          set -e
          # customize.sh 的 base64 载荷必须**不再**包含 "am start" 里的 mqqapi 拉群 / 末尾裸 exit 0(修复标志)
          unzip -p Xmark-Tools.zip customize.sh > /tmp/cs.sh
          python3 - <<'PY'
          import re, base64, sys
          s=open('/tmp/cs.sh').read()
          m=re.search(r"B64END\s*\n?(.*?)B64END", s, re.S)
          d=base64.b64decode(re.sub(r'\s+','', m.group(1))).decode()
          assert not d.rstrip().endswith('exit 0'), 'customize.sh still ends with exit 0'
          assert 'mqqapi' not in d, 'customize.sh still contains am start mqqapi'
          assert 'MODPATH="${0%/*}"' not in d, 'customize.sh still overrides MODPATH'
          print('customize.sh v2.6 fix verified')
          PY
          # monitor_app.sh 必须发出 force_hide / coloros_lock,并从 rkp_done 读 rkp
          unzip -p Xmark-Tools.zip scripts/monitor_app.sh > /tmp/ma.sh
          python3 - <<'PY'
          import re, base64
          s=open('/tmp/ma.sh').read()
          m=re.search(r"B64END\s*\n?(.*?)B64END", s, re.S)
          d=base64.b64decode(re.sub(r'\s+','', m.group(1))).decode()
          assert 'force_hide=${fh}' in d
          assert 'coloros_lock=${cl}' in d
          assert 'rkp_done' in d
          assert 'MODULE_VERSION=2.3' not in d, 'monitor_app.sh still hardcodes 2.3'
          assert 'module.prop' in d and 'mver' in d, 'monitor_app.sh does not read version from module.prop'
          print('monitor_app.sh v2.7 fixes verified')
          PY
          # v2.7.3: 发布包不得携带运行态 pid/ 文件
          if unzip -l Xmark-Tools.zip | grep -Eq ' pid/'; then
            echo "ERROR: release ZIP must not contain pid/ runtime files"
            exit 1
          fi
          echo "pid/ runtime files excluded from release"
          # service.sh PERSIST_FLAGS 必须扩宽
          unzip -p Xmark-Tools.zip service.sh > /tmp/sv.sh
          python3 - <<'PY'
          import re, base64
          s=open('/tmp/sv.sh').read()
          m=re.search(r"B64END\s*\n?(.*?)B64END", s, re.S)
          d=base64.b64decode(re.sub(r'\s+','', m.group(1))).decode()
          for k in ['coloros_lock','coloros_signal','force_hide','notify_always','auto_clean','soter']:
              assert k in d, f'PERSIST_FLAGS missing {k}'
          assert 'drm_hook' in d, 'PERSIST_FLAGS missing drm_hook'
          print('service.sh PERSIST_FLAGS verified')
          PY
          # lib/drmid_hook.so 必须是非空 aarch64 ELF，且导出关键符号
          unzip -p Xmark-Tools.zip lib/drmid_hook.so > /tmp/drmid.so
          test -s /tmp/drmid.so
          file /tmp/drmid.so | grep -Eq 'aarch64|ARM aarch64' || {
            echo "ERROR: lib/drmid_hook.so is not aarch64"; exit 1; }
          for sym in A64HookFunction zn_module JNI_OnLoad; do
            readelf --dyn-syms /tmp/drmid.so | grep -q "$sym" || {
              echo "ERROR: lib/drmid_hook.so missing export $sym"; exit 1; }
          done
          echo "libdrmid_hook.so verified (aarch64 + exports present)"
          # drm_hook_ctl.sh 的 base64 载荷必须是完整可解析的脚本
          unzip -p Xmark-Tools.zip scripts/drm_hook_ctl.sh > /tmp/dh.sh
          python3 - <<'PY'
          import re, base64
          s=open('/tmp/dh.sh').read()
          m=re.search(r"B64END\s*\n?(.*?)B64END", s, re.S)
          assert m, 'drm_hook_ctl.sh: B64END wrapper malformed'
          d=base64.b64decode(re.sub(r'\s+','', m.group(1))).decode()
          for k in ['enable','disable','status','verify']:
              assert k in d, f'drm_hook_ctl.sh missing action {k}'
          assert d.startswith('#!/system/bin/sh'), 'drm_hook_ctl.sh missing shebang'
          assert 'libdrmid_hook.so' in d, 'drm_hook_ctl.sh does not reference the so'
          print('drm_hook_ctl.sh verified')
          PY
          # sepolicy.rule 存在且不含全开规则
          # （先剥注释：文件注释里引用了 `allow hal_drm_widevine * * *` 作为反例）
          unzip -p Xmark-Tools.zip sepolicy.rule > /tmp/se.rule
          test -s /tmp/se.rule
          if sed 's/#.*//' /tmp/se.rule | grep -Eq 'allow\s+\S+\s+\*\s+\*\s+\*'; then
            echo "ERROR: sepolicy.rule contains a blanket allow rule"
            exit 1
          fi
          grep -q execmem /tmp/se.rule || {
            echo "ERROR: sepolicy.rule missing execmem (trampoline needs RWX)"; exit 1; }
          echo "sepolicy.rule verified (no blanket allow, execmem present)"

      - name: Compose release notes
        run: |
          SHA=$(cut -d' ' -f1 release.sha256)
          NOTES_SRC=".github/RELEASE_NOTES.md"
          if [ -f "$NOTES_SRC" ]; then
            # 复制仓库自带的每版说明,末尾追加校验区块
            cp "$NOTES_SRC" RELEASE_NOTES.md
            {
              echo
              echo "### 校验"
              echo
              echo '```'
              echo "Xmark-Tools.zip"
              echo "SHA256: $SHA"
              echo '```'
              echo
              echo "构建时间:$(date -u +'%Y-%m-%d %H:%M UTC')"
            } >> RELEASE_NOTES.md
          else
            # 兜底模板(仓库里没维护 .github/RELEASE_NOTES.md 时使用)
            cat > RELEASE_NOTES.md <<EOF
          ## Xmark-Tools ${{ steps.tag.outputs.modver }}

          构建时间：$(date -u +'%Y-%m-%d %H:%M UTC')

          ### 校验

          \`\`\`
          Xmark-Tools.zip
          SHA256: $SHA
          \`\`\`
          EOF
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Xmark-Tools ${{ steps.tag.outputs.modver }}
          body_path: RELEASE_NOTES.md
          files: |
            Xmark-Tools.zip
            release.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
